amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/scan_corrected"
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    min_particles: 500
    max_particles: 3000

    laser_model_type: "likelihood_field"
    laser_max_range: 3.0
    laser_min_range: 0.3
    max_beams: 120

    sigma_hit: 0.1
    z_hit: 0.9
    z_rand: 0.1

    laser_likelihood_max_dist: 0.5   # ขยายระยะยอมรับความคลาดเคลื่อน → หุ่นไม่ตื่นตระหนกง่าย

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05   # Noise จากการหมุน เมื่อสั่งหมุน (ต่ำ = เชื่อ odometry มาก)
    alpha2: 0.05   # Noise จากการหมุน เมื่อสั่งเดินตรง
    alpha3: 0.05   # Noise จากการเดินตรง เมื่อสั่งเดินตรง
    alpha4: 0.05   # Noise จากการเดินตรง เมื่อสั่งหมุน

    update_min_d: 0.2    # อัปเดต AMCL ทุก 20 cm
    update_min_a: 0.2    # อัปเดต AMCL ทุก ~11 องศา

    resample_interval: 1     # resample ทุก update → particle ไม่กระจาย
    transform_tolerance: 0.3

map_server:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      allow_unknown: true
      max_planning_time: 2.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: "/odom"
    cmd_vel_out_topic: "cmd_vel_nav"  # [แก้] raw→nav: ให้ตรงกับที่ MPPI publish จริงใน Jazzy

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: false

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- Horizon & Sampling ---
      time_steps: 56          # [แก้] 40→56: มองไกลขึ้นเป็น 2.8s ที่ 1m/s (เดิม 2s ไม่พอวางแผนข้าม obstacle)
      model_dt: 0.05          # ขนาด timestep 50ms (คงเดิม เหมาะกับ 20Hz)
      batch_size: 2000        # [แก้] 500→2000: sample trajectory มากขึ้น → เจอทางที่ดีกว่าในแปลงที่มี obstacle กระจาย
      iteration_count: 2      # [แก้] 1→2: refine trajectory 2 รอบก่อน publish → path เรียบขึ้นมาก

      # --- Noise / Exploration ---
      vx_std: 0.5             # [แก้] 0.1→0.5: KEY FIX — std=0.1 ทำให้ sample 99% อยู่แค่ 0-0.3 m/s ต้องเพิ่มให้กระจายถึง 1.0 m/s
      vy_std: 0.0             # DiffDrive ไม่มี lateral velocity
      wz_std: 0.4             # [แก้] 0.8→0.4: ลดความแปรปรวนการหมุน → หุ่นไม่ส้ายหัว/wiggle

      # --- Velocity Limits ---
      vx_max: 1.0             # ความเร็วสูงสุดตรง 1 m/s (ตามที่ตั้งไว้)
      vx_min: 0.1             # [แก้] 0.0→0.1: บังคับเดินหน้าเสมอ ไม่ให้ MPPI sample หยุดนิ่ง
      vy_max: 0.0
      wz_max: 0.8             # ความเร็วเลี้ยวสูงสุด (คงเดิม)

      # --- Core MPPI Params ---
      temperature: 0.15       # [แก้] 0.3→0.15: ลดลงครึ่งหนึ่ง → sample ไม่กระจายมากเกิน → path นิ่งขึ้น
                              #   (0.3 สูงเกิน ทำให้ wiggle ที่เห็นในรัน 1)
      gamma: 0.015            # regularization weight (คงเดิม)

      prune_distance: 1.7     # ตัด path ที่ผ่านมาแล้วออก ประหยัด compute
      transform_tolerance: 0.3
      motion_model: "DiffDrive"
      visualize: true
      retry_attempt_limit: 1
      reset_period: 1.0

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0      # บังคับอยู่ใน velocity limits (คงเดิม)

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0        # [แก้] 5→3: ลดการชะลอตอนเข้าใกล้ waypoint
        threshold_to_consider: 0.8  # [แก้] 1.4→0.8  # [แก้] 1.4→0.8: เริ่ม "จ้องเป้าหมาย" ใกล้ขึ้น
                                    #   (1.4 ทำให้ดิ่งตรงเข้าเป้าแรงเกิน → loop ที่เห็นในรัน 2)

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        period: 0.25
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0        # [แก้] 14→10→7: ลดลงอีก ไม่ให้ลงโทษ trajectory เร็วๆ ที่เบี่ยงจาก path นิดหน่อย
                                #   (14 แข็งเกิน → ขัดกับ CostCritic ตรงช่องแคบ)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0        # ดึงหุ่นให้ follow path (คงเดิม)
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5        # [แก้] 2.0→3.5: บังคับหันตามทิศ path มากขึ้น → ลด oscillation ด้านหัว
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785
        mode: 0

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0        # ให้ความสำคัญกับการเดินหน้า (คงเดิม)
        threshold_to_consider: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_bt_xml_filename: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    accel_lim_v: [2.5, 0.0, 3.2]
    input_topic: "cmd_vel_nav"   # [แก้] ให้รับจาก topic จริงที่ MPPI ส่ง
    output_topic: "cmd_vel_smoothed"

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "wait", "drive_on_heading", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

docking_server:
  ros__parameters:
    use_sim_time: true
    dock_plugins: ["my_simple_dock"]
    my_simple_dock:
      plugin: "opennav_docking::SimpleChargingDock"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      robot_radius: 0.25
      resolution: 0.035714
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_corrected
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          min_range: 0.3
          observation_persistence: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7   # [แก้] 0.5→0.7: หุ่น radius 0.25m ต้องการ margin มากกว่า
                                #   Smac2D จะวาง global path ห่าง obstacle มากขึ้น
                                #   ลดภาระที่ MPPI ต้องหลบเองในระยะสั้น
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0   # [แก้] 2.0→5.0: เพิ่มความถี่ให้ทัน controller 20Hz
                              #   (2Hz ช้าเกิน → MPPI ใช้ costmap เก่าตัดสินใจ)
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 7                # [แก้] 5→7: ขยาย local window ให้กว้างขึ้น
      height: 7               #   ที่ 1m/s หน้าต่าง 5m ให้เวลาแค่ 5s ควรมองไกลกว่า
      resolution: 0.035714
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_corrected
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.5   # local costmap คงเดิม — MPPI ใช้ค่านี้ตัดสินใจแบบ real-time
      always_send_full_costmap: True

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 5.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: "[[0.5, 0.3], [0.5, -0.3], [0.0, -0.3], [0.0, 0.3]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: "[[0.7, 0.4], [0.7, -0.4], [0.0, -0.4], [0.0, 0.4]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: false
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_corrected"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - "map_server"
      - "amcl"
      - "controller_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
      - "collision_monitor"
      - "velocity_smoother"
      - "docking_server"